<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded Squircle Background -->
  <rect width="100" height="100" rx="30" fill="#3b66ff"/>
  
  <!-- Antenna -->
  <path d="M42 35 L50 35 L50 42" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Robot Head Box -->
  <rect x="34" y="42" width="32" height="25" rx="7" fill="none" stroke="#ffffff" stroke-width="5"/>
  
  <!-- Left & Right Ear Pins -->
  <line x1="29" y1="54" x2="34" y2="54" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="66" y1="54" x2="71" y2="54" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Vertical Eyes -->
  <line x1="44" y1="50" x2="44" y2="58" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="56" y1="50" x2="56" y2="58" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
</svg>
